name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Offline Unit & API Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run deterministic offline test suite
        run: pytest

      - name: Verify package imports and CLI entrypoints
        run: |
          python -c "import bd_telecom_scraper, bd_telecom_scraper.orchestrator, bd_telecom_scraper.api.server, bd_telecom_scraper.llm.pipeline, bd_telecom_scraper.tavily.pipeline, bd_telecom_scraper.facebook.pipeline"
          bd-telecom-scraper --list-sources > /dev/null
          bd-telecom-tavily queries > /dev/null
          bd-telecom-facebook list-sources > /dev/null
